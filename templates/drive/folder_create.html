{% extends "base.html" %}
{% block content %}
<h1 class="h5 mb-3">New folder in {{ parent.name }}</h1>

<form method="post" class="card card-body">
  {% csrf_token %}
  <input class="form-control mb-2" type="text" name="name" placeholder="Folder name" required>

  <div class="d-flex gap-2">
    <button class="btn btn-primary">Create</button>
    <!-- ✅ include project slug -->
    <a class="btn btn-outline-secondary"
       href="{% url 'drive_folder' org_slug=org.slug project_slug=project.slug folder_id=parent.id %}">
      Cancel
    </a>
  </div>
</form>
{% endblock %}
