{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">{{ org.name }} — Documents</h1>
<div class="d-flex justify-content-between mb-2">
  <div></div>
  <a class="btn btn-primary" href="{% url 'doc_upload' org.slug %}">Upload Document</a>
</div>
<table class="table table-sm align-middle">
  <thead><tr><th>Type</th><th>Number</th><th>Title</th><th>Version</th><th>Uploaded</th></tr></thead>
  <tbody>
    {% for d in docs %}
    <tr>
      <td>{{ d.doc_type }}</td>
      <td><a href="{% url 'doc_detail' org.slug d.id %}">{{ d.number }}</a></td>
      <td>{{ d.title }}</td>
      <td>{{ d.version }}</td>
      <td>{{ d.created_at|date:"Y-m-d H:i" }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="text-muted">No documents yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
