{% extends "base.html" %}
{% block content %}
<h1 class="h5 mb-3">{{ org.name }} — Projects</h1>
<div class="d-flex justify-content-between mb-2">
  <div></div>
  <a class="btn btn-primary btn-sm" href="{% url 'project_create' org.slug %}">New Project</a>
</div>
<ul class="list-group">
  {% for p in projects %}
    <li class="list-group-item d-flex justify-content-between">
      <span>{{ p.name }}</span>
      <div class="btn-group" role="group">
        <a class="btn btn-outline-primary btn-sm" href="{% url 'weld_log' org.slug p.slug %}">Weld Log</a>
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'project_drive_root' org.slug p.slug %}">Open Drive</a>
      </div>

    </li>
  {% empty %}
    <li class="list-group-item text-muted">No projects assigned to you.</li>
  {% endfor %}
</ul>
{% endblock %}
