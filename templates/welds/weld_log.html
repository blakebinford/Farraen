{% extends "base.html" %}

{% block extra_head %}
  {{ block.super }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/css/tabulator_modern.min.css">
  <style>
    :root {
      color-scheme: light;
    }

    #weld-log-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    #weld-log-toolbar .btn {
      min-width: 8rem;
    }

    #weld-log-grid {
      width: 100%;
      height: 78vh;
      min-height: 460px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 0.5rem;
      overflow: hidden;
      background-color: #fff;
    }

    #weld-log-status {
      min-height: 1.5rem;
    }

    .tabulator-row.is-dirty {
      --dirty-bg: rgba(37, 99, 235, 0.08);
      background-color: var(--dirty-bg);
    }

    .tabulator-cell.tabulator-validation-fail {
      box-shadow: inset 0 0 0 2px rgba(220, 38, 38, 0.6);
      background-color: rgba(254, 226, 226, 0.6);
    }

    .tabulator-col.tabulator-frozen {
      box-shadow: 2px 0 0 rgba(15, 23, 42, 0.08);
      background-color: rgba(241, 245, 249, 0.85);
    }

    .lookup-editor {
      position: relative;
      width: 100%;
      max-height: 18rem;
    }

    .lookup-editor input[type="text"] {
      width: 100%;
      padding: 0.35rem 0.5rem;
      border: 1px solid rgba(148, 163, 184, 0.9);
      border-radius: 0.35rem;
      font-size: 0.9rem;
    }

    .lookup-editor-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 30;
      display: none;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 0.35rem;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
      background-color: #fff;
      max-height: 14rem;
      overflow-y: auto;
      padding-block: 0.25rem;
    }

    .lookup-editor-results.is-open {
      display: block;
    }

    .lookup-editor-option {
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.88rem;
    }

    .lookup-editor-option strong {
      font-weight: 600;
      color: #1f2937;
    }

    .lookup-editor-option span {
      color: #475569;
      font-size: 0.75rem;
    }

    .lookup-editor-option.is-active,
    .lookup-editor-option:hover {
      background-color: rgba(59, 130, 246, 0.12);
    }

    .tabulator .tabulator-tableholder {
      font-size: 0.92rem;
    }
  </style>
{% endblock %}

{% block content %}
  <div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2">
    <div>
      <h1 class="h3 mb-1">{{ project.name }} Weld Log</h1>
      <p class="text-muted mb-0">Spreadsheet-style editor for capturing weld information.</p>
    </div>
  </div>

  {% if setup_error %}
    <div class="alert alert-warning" role="alert">
      {{ setup_error }}
    </div>
  {% else %}
    <div class="card">
      <div class="card-body">
        <div id="weld-log-toolbar" class="mb-2">
          <button type="button" class="btn btn-outline-secondary" id="weld-log-export-csv">Export CSV</button>
          <button type="button" class="btn btn-outline-secondary" id="weld-log-export-xlsx">Export Excel</button>
          <button type="button" class="btn btn-outline-secondary" id="weld-log-delete-empties">Delete Empty Rows</button>
          <div class="ms-auto d-flex gap-2 flex-wrap">
            <div class="btn-group" role="group" aria-label="Edit history controls">
              <button type="button" class="btn btn-outline-secondary" id="weld-log-undo" title="Undo (Ctrl+Z)">Undo</button>
              <button type="button" class="btn btn-outline-secondary" id="weld-log-redo" title="Redo (Ctrl+Y)">Redo</button>
            </div>
            <button type="button" class="btn btn-outline-primary" id="weld-log-add-row">Add Row</button>
            <button type="button" class="btn btn-primary" id="weld-log-save">Save Changes</button>
          </div>
        </div>
        <div id="weld-log-grid" aria-live="polite"></div>
        <div id="weld-log-status" class="small text-muted mt-2" role="status"></div>
      </div>
    </div>
  {% if not setup_error %}
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
      (function () {
      const dataEndpoint = "{{ data_url }}";
      const heatOptionsEndpoint = "{{ heat_options_url }}";
      const heatSearchEndpoint = "{{ heat_search_url }}";
      const ndeRigsEndpoint = "{{ nde_rigs_url }}";

      const statusEl = document.getElementById("weld-log-status");
      const saveBtn = document.getElementById("weld-log-save");
      const exportCsvBtn = document.getElementById("weld-log-export-csv");
      const exportExcelBtn = document.getElementById("weld-log-export-xlsx");
      const deleteEmptiesBtn = document.getElementById("weld-log-delete-empties");
      const undoBtn = document.getElementById("weld-log-undo");
      const redoBtn = document.getElementById("weld-log-redo");
      const addRowBtn = document.getElementById("weld-log-add-row");

      const heatCache = new Map();
      const ndeRigCache = new Map();
      const dirtyRows = new Set();
      let suppressRowAddedEvents = false;

      function snapshotRow(rowComponent) {
        if (!rowComponent) {
          return;
        }
        try {
          rowComponent._originalData = JSON.stringify(rowComponent.getData());
        } catch (error) {
          rowComponent._originalData = JSON.stringify({});
        }
      }

      function markRowDirty(rowComponent) {
        if (!rowComponent) {
          return;
        }
        const original = rowComponent._originalData;
        let isDirty = true;
        try {
          const serialized = JSON.stringify(rowComponent.getData());
          if (original !== null && original === serialized) {
            isDirty = false;
          }
        } catch (error) {
          isDirty = true;
        }

        if (original === undefined) {
          // No snapshot captured yet, do not flag as clean.
          isDirty = true;
        }

        if (isDirty) {
          dirtyRows.add(rowComponent);
          rowComponent.getElement()?.classList.add("is-dirty");
        } else {
          dirtyRows.delete(rowComponent);
          rowComponent.getElement()?.classList.remove("is-dirty");
        }
      }

      const dispositionOptions = [
        { value: "accepted", label: "Accepted" },
        { value: "repair", label: "Repair" },
        { value: "cut_out", label: "Cut Out" },
      ];

      function setStatus(message, variant = "muted") {
        if (!statusEl) {
          return;
        }
        const colors = {
          muted: "text-muted",
          success: "text-success",
          danger: "text-danger",
          warning: "text-warning",
        };
        statusEl.className = `small mt-2 ${colors[variant] || colors.muted}`;
        statusEl.textContent = message || "";
      }

      function updateStatusCounts(extra = "") {
        if (!statusEl || !table) {
          return;
        }
        const totalRows = typeof table.getDataCount === "function"
          ? table.getDataCount("active")
          : table.getData().length;
        const selected = table.getSelectedData().length;
        const dirtyCount = dirtyRows.size;
        const summary = [
          `${totalRows} row${totalRows === 1 ? "" : "s"}`,
          `${selected} selected`,
          `${dirtyCount} modified`,
        ].join(" • ");
        const suffix = extra ? ` – ${extra}` : "";
        statusEl.textContent = `${summary}${suffix}`;
      }

      function refreshHistoryButtons() {
        if (!table) {
          return;
        }
        const undoSize = typeof table.getHistoryUndoSize === "function" ? table.getHistoryUndoSize() : 0;
        const redoSize = typeof table.getHistoryRedoSize === "function" ? table.getHistoryRedoSize() : 0;
        if (undoBtn) {
          undoBtn.disabled = undoSize <= 0;
        }
        if (redoBtn) {
          redoBtn.disabled = redoSize <= 0;
        }
      }

      function formatIsoDateTime(value) {
        if (!value) {
          return "";
        }
        return String(value)
          .replace("T", " ")
          .replace(/Z$/, "")
          .replace(/\+\d{2}:?\d{2}$/, "")
          .replace(/\.\d+/, "");
      }

      function getCsrfToken() {
        const name = "csrftoken=";
        const cookies = document.cookie ? document.cookie.split(";") : [];
        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.startsWith(name)) {
            return decodeURIComponent(cookie.substring(name.length));
          }
        }
        return "";
      }

      function rememberHeat(option) {
        if (!option || !option.id) {
          return option;
        }
        heatCache.set(option.id, option);
        return option;
      }

      function rememberNdeRig(option) {
        if (!option || !option.id) {
          return option;
        }
        ndeRigCache.set(option.id, option);
        return option;
      }

      function normalizeRow(row) {
        if (!row) {
          return {};
        }
        const normalized = {
          id: row.id ?? null,
          weld_id: row.weld_id ?? "",
          nde_number: row.nde_number ?? "",
          drawing_number: row.drawing_number ?? "",
          weld_type: row.weld_type ?? "",
          date_welded: row.date_welded || "",
          welder_stencil_root_hotpass: row.welder_stencil_root_hotpass ?? "",
          welder_stencil_fill: row.welder_stencil_fill ?? "",
          welder_stencil_fill_additional: row.welder_stencil_fill_additional ?? "",
          welder_stencil_cap: row.welder_stencil_cap ?? "",
          nde_date: row.nde_date || "",
          disposition: row.disposition || "accepted",
          disposition_comment: row.disposition_comment ?? "",
          material1_heat: row.material1_heat_id ?? null,
          material1_heat_label: row.material1_heat_number ?? "",
          material1_description: row.material1_description ?? "",
          material1_grade: row.material1_grade ?? "",
          material1_outer_diameter_in: row.material1_outer_diameter_in ?? "",
          material1_wall_thickness_in: row.material1_wall_thickness_in ?? "",
          material2_heat: row.material2_heat_id ?? null,
          material2_heat_label: row.material2_heat_number ?? "",
          material2_description: row.material2_description ?? "",
          material2_grade: row.material2_grade ?? "",
          material2_outer_diameter_in: row.material2_outer_diameter_in ?? "",
          material2_wall_thickness_in: row.material2_wall_thickness_in ?? "",
          nde_rig: row.nde_rig_id ?? null,
          nde_rig_name: row.nde_rig_name ?? "",
          created_at: row.created_at || "",
          updated_at: row.updated_at || "",
          created_by_id: row.created_by_id ?? null,
          created_by_name: row.created_by_name ?? "",
          updated_by_id: row.updated_by_id ?? null,
          updated_by_name: row.updated_by_name ?? "",
        };

        if (normalized.material1_heat && row.material1_heat_number) {
          rememberHeat({
            id: normalized.material1_heat,
            heat_number: row.material1_heat_number,
            description: row.material1_description ?? "",
            material_grade: row.material1_grade ?? "",
            outer_diameter_in: row.material1_outer_diameter_in ?? "",
            wall_thickness_in: row.material1_wall_thickness_in ?? "",
          });
        }

        if (normalized.material2_heat && row.material2_heat_number) {
          rememberHeat({
            id: normalized.material2_heat,
            heat_number: row.material2_heat_number,
            description: row.material2_description ?? "",
            material_grade: row.material2_grade ?? "",
            outer_diameter_in: row.material2_outer_diameter_in ?? "",
            wall_thickness_in: row.material2_wall_thickness_in ?? "",
          });
        }

        if (normalized.nde_rig && row.nde_rig_name) {
          rememberNdeRig({ id: normalized.nde_rig, name: row.nde_rig_name });
        }

        return normalized;
      }

      function denormalizeRow(row) {
        return {
          id: row.id ?? undefined,
          weld_id: row.weld_id ?? "",
          nde_number: row.nde_number ?? "",
          drawing_number: row.drawing_number ?? "",
          weld_type: row.weld_type ?? "",
          date_welded: row.date_welded || "",
          welder_stencil_root_hotpass: row.welder_stencil_root_hotpass ?? "",
          welder_stencil_fill: row.welder_stencil_fill ?? "",
          welder_stencil_fill_additional: row.welder_stencil_fill_additional ?? "",
          welder_stencil_cap: row.welder_stencil_cap ?? "",
          nde_date: row.nde_date || "",
          nde_rig_id: row.nde_rig ?? null,
          disposition: row.disposition || "accepted",
          disposition_comment: row.disposition_comment ?? "",
          material1_heat_id: row.material1_heat ?? null,
          material1_description: row.material1_description ?? "",
          material1_grade: row.material1_grade ?? "",
          material1_outer_diameter_in: row.material1_outer_diameter_in ?? "",
          material1_wall_thickness_in: row.material1_wall_thickness_in ?? "",
          material2_heat_id: row.material2_heat ?? null,
          material2_description: row.material2_description ?? "",
          material2_grade: row.material2_grade ?? "",
          material2_outer_diameter_in: row.material2_outer_diameter_in ?? "",
          material2_wall_thickness_in: row.material2_wall_thickness_in ?? "",
        };
      }

      async function preloadHeatOptions() {
        if (!heatOptionsEndpoint) {
          return [];
        }
        try {
          const response = await fetch(heatOptionsEndpoint, { credentials: "same-origin" });
          if (!response.ok) {
            return [];
          }
          const payload = await response.json();
          const heats = payload.heats || [];
          heats.forEach(option => rememberHeat(option));
          return heats;
        } catch (error) {
          console.error("Failed to load heat options", error);
          return [];
        }
      }

      async function searchHeatOptions(term) {
        const normalizedTerm = (term || "").toLowerCase();
        const local = [];
        for (const option of heatCache.values()) {
          if (!normalizedTerm) {
            local.push(option);
            continue;
          }
          const haystack = [
            option.heat_number,
            option.description,
            option.material_grade,
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();
          if (haystack.includes(normalizedTerm)) {
            local.push(option);
          }
          if (local.length >= 20) {
            break;
          }
        }

        if (local.length >= 20 || !heatSearchEndpoint || normalizedTerm.length < 2) {
          return local;
        }

        try {
          const response = await fetch(`${heatSearchEndpoint}?q=${encodeURIComponent(term)}`, {
            credentials: "same-origin",
          });
          if (response.ok) {
            const payload = await response.json();
            const results = payload.results || [];
            results.forEach(option => rememberHeat(option));
            const merged = [...local];
            for (const option of results) {
              if (!merged.some(existing => existing.id === option.id)) {
                merged.push(option);
              }
            }
            return merged;
          }
        } catch (error) {
          console.error("Heat search failed", error);
        }
        return local;
      }

      async function preloadNdeRigs() {
        if (!ndeRigsEndpoint) {
          return [];
        }
        try {
          const response = await fetch(ndeRigsEndpoint, { credentials: "same-origin" });
          if (!response.ok) {
            return [];
          }
          const payload = await response.json();
          const rigs = payload.nde_rigs || [];
          rigs.forEach(option => rememberNdeRig(option));
          return rigs;
        } catch (error) {
          console.error("Failed to load NDE rigs", error);
          return [];
        }
      }

      function formatHeatValue(value, dataLabel) {
        if (!value) {
          return "";
        }
        const fromCache = heatCache.get(value);
        if (fromCache) {
          return fromCache.heat_number;
        }
        return dataLabel || "";
      }

      function formatNdeRigValue(value, dataLabel) {
        if (!value) {
          return "";
        }
        const cached = ndeRigCache.get(value);
        if (cached) {
          return cached.name;
        }
        return dataLabel || "";
      }

      function lookupEditorFactory({ search, getInitialLabel, onSelect, placeholder = "Type to search" }) {
        return function (cell, onRendered, success, cancel) {
          const container = document.createElement("div");
          container.className = "lookup-editor";
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = placeholder;
          input.value = getInitialLabel(cell.getValue(), cell.getData()) || "";
          container.appendChild(input);

          const resultsEl = document.createElement("div");
          resultsEl.className = "lookup-editor-results";
          container.appendChild(resultsEl);

          let options = [];
          let activeIndex = -1;
          let searchToken = 0;

          function closeResults() {
            resultsEl.classList.remove("is-open");
            resultsEl.innerHTML = "";
            activeIndex = -1;
          }

          function highlightActive() {
            const items = resultsEl.querySelectorAll(".lookup-editor-option");
            items.forEach((item, index) => {
              item.classList.toggle("is-active", index === activeIndex);
            });
          }

          function renderOptions(list) {
            resultsEl.innerHTML = "";
            if (!list.length) {
              closeResults();
              return;
            }
            list.forEach((option, index) => {
              const item = document.createElement("div");
              item.className = "lookup-editor-option";
              item.tabIndex = -1;
              const title = document.createElement("strong");
              title.textContent = option.heat_number || option.name || option.label || "";
              item.appendChild(title);
              const meta = document.createElement("span");
              const secondary = [option.description, option.material_grade]
                .filter(Boolean)
                .join(" • ");
              meta.textContent = secondary;
              item.appendChild(meta);
              item.addEventListener("mousedown", event => {
                event.preventDefault();
                applySelection(option);
              });
              resultsEl.appendChild(item);
              if (index === activeIndex) {
                item.classList.add("is-active");
              }
            });
            resultsEl.classList.add("is-open");
          }

          async function performSearch(term) {
            const token = ++searchToken;
            try {
              const list = await search(term, cell);
              if (token !== searchToken) {
                return;
              }
              options = list || [];
              activeIndex = options.length ? 0 : -1;
              renderOptions(options);
              highlightActive();
            } catch (error) {
              console.error("Lookup search failed", error);
              closeResults();
            }
          }

          function applySelection(option) {
            closeResults();
            if (!option) {
              onSelect(null, cell);
              success(null);
              return;
            }
            input.value = option.heat_number || option.name || option.label || "";
            onSelect(option, cell);
            success(option.id ?? null);
          }

          onRendered(() => {
            input.focus();
            input.select();
            performSearch(input.value || "");
          });

          input.addEventListener("input", () => {
            performSearch(input.value || "");
          });

          input.addEventListener("keydown", event => {
            if (event.key === "ArrowDown" && options.length) {
              event.preventDefault();
              activeIndex = Math.min(options.length - 1, activeIndex + 1);
              highlightActive();
            } else if (event.key === "ArrowUp" && options.length) {
              event.preventDefault();
              activeIndex = Math.max(0, activeIndex - 1);
              highlightActive();
            } else if (event.key === "Enter") {
              event.preventDefault();
              if (options.length && activeIndex >= 0) {
                applySelection(options[activeIndex]);
              } else if (!input.value.trim()) {
                applySelection(null);
              }
            } else if (event.key === "Escape") {
              event.preventDefault();
              cancel();
            }
          });

          input.addEventListener("blur", () => {
            window.setTimeout(() => {
              if (!container.contains(document.activeElement)) {
                if (!input.value.trim()) {
                  applySelection(null);
                } else {
                  cancel();
                }
              }
            }, 150);
          });

          return container;
        };
      }

      function createHeatEditor(prefix) {
        return lookupEditorFactory({
          placeholder: "Search heat numbers",
          getInitialLabel(value, data) {
            const labelKey = `${prefix}_heat_label`;
            return formatHeatValue(value, data ? data[labelKey] : "");
          },
          async search(term) {
            return searchHeatOptions(term);
          },
          onSelect(option, cell) {
            const row = cell.getRow();
            if (!option) {
              const patch = {};
              patch[`${prefix}_heat_label`] = "";
              row.update(patch);
              return;
            }
            rememberHeat(option);
            const patch = {
              [`${prefix}_heat_label`]: option.heat_number || "",
            };
            if (!row.getData()[`${prefix}_description`]) {
              patch[`${prefix}_description`] = option.description || "";
            }
            if (!row.getData()[`${prefix}_grade`]) {
              patch[`${prefix}_grade`] = option.material_grade || option.grade || "";
            }
            if (!row.getData()[`${prefix}_outer_diameter_in`]) {
              patch[`${prefix}_outer_diameter_in`] = option.outer_diameter_in || option.od || "";
            }
            if (!row.getData()[`${prefix}_wall_thickness_in`]) {
              patch[`${prefix}_wall_thickness_in`] = option.wall_thickness_in || option.wall_thickness || "";
            }
            row.update(patch);
          },
        });
      }

      const heatEditorMaterial1 = createHeatEditor("material1");
      const heatEditorMaterial2 = createHeatEditor("material2");

      const ndeRigEditor = lookupEditorFactory({
        placeholder: "Search NDE rigs",
        getInitialLabel(value, data) {
          return formatNdeRigValue(value, data ? data.nde_rig_name : "");
        },
        async search(term) {
          const normalized = (term || "").toLowerCase();
          const matches = [];
          for (const option of ndeRigCache.values()) {
            if (!normalized || option.name.toLowerCase().includes(normalized)) {
              matches.push(option);
            }
          }
          matches.sort((a, b) => a.name.localeCompare(b.name));
          if (matches.length || !normalized || normalized.length < 2 || !ndeRigsEndpoint) {
            return matches;
          }
          try {
            const response = await fetch(ndeRigsEndpoint, { credentials: "same-origin" });
            if (response.ok) {
              const payload = await response.json();
              const rigs = payload.nde_rigs || [];
              rigs.forEach(option => rememberNdeRig(option));
              return rigs.filter(option => option.name.toLowerCase().includes(normalized));
            }
          } catch (error) {
            console.error("Failed to refresh NDE rigs", error);
          }
          return matches;
        },
        onSelect(option, cell) {
          const row = cell.getRow();
          if (!option) {
            row.update({ nde_rig_name: "" });
            return;
          }
          rememberNdeRig(option);
          row.update({ nde_rig_name: option.name || "" });
        },
      });

      function validateDispositionComment(cell, value) {
        const disposition = cell.getRow().getData().disposition;
        if (disposition === "repair" || disposition === "cut_out") {
          if (!value || !String(value).trim()) {
            return "Comment required when disposition is Repair or Cut Out.";
          }
        }
        return true;
      }

      let table = null;

      function buildColumns() {
        return [
          {
            title: "Weld ID",
            field: "weld_id",
            width: 150,
            frozen: true,
            headerSort: true,
            editor: "input",
            validator: ["required"],
          },
          {
            title: "NDE Number",
            field: "nde_number",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Drawing Number",
            field: "drawing_number",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 1 Heat",
            field: "material1_heat",
            headerSort: true,
            formatter(cell) {
              const data = cell.getRow().getData();
              return formatHeatValue(cell.getValue(), data.material1_heat_label);
            },
            editor: function (cell, onRendered, success, cancel) {
              return heatEditorMaterial1(cell, onRendered, success, cancel);
            },
          },
          {
            title: "Material 1 Description",
            field: "material1_description",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 1 Grade",
            field: "material1_grade",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 1 O.D.",
            field: "material1_outer_diameter_in",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 1 Wall",
            field: "material1_wall_thickness_in",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 2 Heat",
            field: "material2_heat",
            headerSort: true,
            formatter(cell) {
              const data = cell.getRow().getData();
              return formatHeatValue(cell.getValue(), data.material2_heat_label);
            },
            editor: function (cell, onRendered, success, cancel) {
              return heatEditorMaterial2(cell, onRendered, success, cancel);
            },
          },
          {
            title: "Material 2 Description",
            field: "material2_description",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 2 Grade",
            field: "material2_grade",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 2 O.D.",
            field: "material2_outer_diameter_in",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Material 2 Wall",
            field: "material2_wall_thickness_in",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Weld Type",
            field: "weld_type",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Date Welded",
            field: "date_welded",
            headerSort: true,
            editor: "date",
            editorParams: { format: "YYYY-MM-DD" },
          },
          {
            title: "Welder Root/Hot Pass",
            field: "welder_stencil_root_hotpass",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Welder Fill",
            field: "welder_stencil_fill",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Welder Fill (Addl)",
            field: "welder_stencil_fill_additional",
            editor: "input",
            headerSort: true,
          },
          {
            title: "Welder Cap",
            field: "welder_stencil_cap",
            editor: "input",
            headerSort: true,
          },
          {
            title: "NDE Date",
            field: "nde_date",
            headerSort: true,
            editor: "date",
            editorParams: { format: "YYYY-MM-DD" },
          },
          {
            title: "NDE Rig",
            field: "nde_rig",
            headerSort: true,
            formatter(cell) {
              const data = cell.getRow().getData();
              return formatNdeRigValue(cell.getValue(), data.nde_rig_name);
            },
            editor: function (cell, onRendered, success, cancel) {
              return ndeRigEditor(cell, onRendered, success, cancel);
            },
          },
          {
            title: "Disposition",
            field: "disposition",
            headerSort: true,
            editor: "list",
            editorParams: {
              values: dispositionOptions.reduce((acc, option) => {
                acc[option.value] = option.label;
                return acc;
              }, {}),
              autocomplete: true,
              allowEmpty: false,
            },
            validator: ["required"],
            formatter(cell) {
              const value = cell.getValue();
              const match = dispositionOptions.find(option => option.value === value);
              return match ? match.label : "";
            },
          },
          {
            title: "Disposition Comment",
            field: "disposition_comment",
            editor: "input",
            headerSort: true,
            validator: [validateDispositionComment],
          },
          {
            title: "Created",
            field: "created_at",
            headerSort: true,
            mutator(value) {
              return formatIsoDateTime(value);
            },
            editable: false,
          },
          {
            title: "Created By",
            field: "created_by_name",
            headerSort: true,
            editable: false,
          },
          {
            title: "Updated By",
            field: "updated_by_name",
            headerSort: true,
            editable: false,
          },
          {
            title: "Updated",
            field: "updated_at",
            headerSort: true,
            mutator(value) {
              return formatIsoDateTime(value);
            },
            editable: false,
          },
        ];
      }

      table = new Tabulator("#weld-log-grid", {
        layout: "fitDataStretch",
        height: "100%",
        reactiveData: false,
        data: [],
        columns: buildColumns(),
        movableColumns: true,
        resizableColumns: true,
        resizableRows: false,
        autoResize: true,
        selectableRange: true,
        selectableRangeColumns: true,
        selectableRangeRows: true,
        selectableRollingSelection: true,
        clipboard: true,
        clipboardCopyRowRangeSelection: "data",
        clipboardPasteParser: "range",
        clipboardPasteAction: "replace",
        clipboardCopyStyled: false,
        history: true,
        keybindings: {
          navPrev: "shift+tab",
          navNext: "tab",
        },
        persistenceMode: "local",
        index: "id",
      });

      table.on("selectionChanged", () => {
        updateStatusCounts();
      });

      table.on("dataLoaded", () => {
        const rows = table.getRows();
        rows.forEach(row => {
          snapshotRow(row);
          row.getElement()?.classList.remove("is-dirty");
        });
        dirtyRows.clear();
        updateStatusCounts();
        refreshHistoryButtons();
      });

      table.on("cellEdited", cell => {
        const row = cell.getRow();
        markRowDirty(row);
        if (cell.getField() === "disposition") {
          const commentCell = row.getCell("disposition_comment");
          commentCell?.validate();
        }
        updateStatusCounts();
        refreshHistoryButtons();
      });

      table.on("cellEditCancelled", cell => {
        updateStatusCounts();
      });

      table.on("rowAdded", row => {
        if (suppressRowAddedEvents) {
          snapshotRow(row);
          row.getElement()?.classList.remove("is-dirty");
          refreshHistoryButtons();
          return;
        }
        if (row._originalData === undefined) {
          row._originalData = null;
        }
        markRowDirty(row);
        updateStatusCounts("Row added");
        refreshHistoryButtons();
      });

      table.on("rowDeleted", row => {
        dirtyRows.delete(row);
        updateStatusCounts();
        refreshHistoryButtons();
      });

      table.on("historyUndo", (action, component) => {
        const row = component?.getRow ? component.getRow() : null;
        if (row) {
          markRowDirty(row);
        }
        updateStatusCounts("Undo");
        refreshHistoryButtons();
      });

      table.on("historyRedo", (action, component) => {
        const row = component?.getRow ? component.getRow() : null;
        if (row) {
          markRowDirty(row);
        }
        updateStatusCounts("Redo");
        refreshHistoryButtons();
      });

      function addNewRow() {
        const blank = {
          weld_id: "",
          disposition: "accepted",
        };
        const row = table.addRow(blank, true);
        Promise.resolve(row).then(rowComponent => {
          rowComponent._originalData = null;
          markRowDirty(rowComponent);
          updateStatusCounts("New row added");
          refreshHistoryButtons();
        });
      }

      function isRowEmpty(data) {
        if (!data) {
          return true;
        }
        const keysToInspect = [
          "weld_id",
          "nde_number",
          "drawing_number",
          "weld_type",
          "date_welded",
          "welder_stencil_root_hotpass",
          "welder_stencil_fill",
          "welder_stencil_fill_additional",
          "welder_stencil_cap",
          "nde_date",
          "disposition_comment",
          "material1_heat",
          "material1_description",
          "material1_grade",
          "material1_outer_diameter_in",
          "material1_wall_thickness_in",
          "material2_heat",
          "material2_description",
          "material2_grade",
          "material2_outer_diameter_in",
          "material2_wall_thickness_in",
          "nde_rig",
        ];

        return !keysToInspect.some(key => {
          const value = data[key];
          if (value === null || value === undefined) {
            return false;
          }
          if (typeof value === "string") {
            return value.trim() !== "";
          }
          return true;
        });
      }

      function deleteEmptyRows() {
        const rows = table.getRows();
        let removed = 0;
        rows.forEach(rowComponent => {
          if (isRowEmpty(rowComponent.getData())) {
            rowComponent.delete();
            dirtyRows.delete(rowComponent);
            removed += 1;
          }
        });
        updateStatusCounts(removed ? `${removed} empty row${removed === 1 ? "" : "s"} removed` : "No empty rows");
        refreshHistoryButtons();
      }

      async function saveRow(rowComponent) {
        const data = rowComponent.getData();
        const validation = rowComponent.validate();
        if (validation !== true) {
          throw new Error("Validation failed");
        }
        const payload = denormalizeRow(data);
        const response = await fetch(dataEndpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCsrfToken(),
          },
          credentials: "same-origin",
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || `Save failed (${response.status})`);
        }
        const result = await response.json();
        const normalized = normalizeRow(result.weld);
        rowComponent.update(normalized);
        snapshotRow(rowComponent);
        markRowDirty(rowComponent);
        return normalized;
      }

      async function saveChanges() {
        if (!dirtyRows.size) {
          setStatus("No changes to save.");
          return;
        }
        setStatus("Saving changes…", "muted");
        const rows = Array.from(dirtyRows);
        let saved = 0;
        for (const rowComponent of rows) {
          try {
            await saveRow(rowComponent);
            saved += 1;
          } catch (error) {
            console.error("Failed to save row", error);
            setStatus(error.message || "Failed to save some rows.", "danger");
            updateStatusCounts();
            return;
          }
        }
        setStatus(`${saved} row${saved === 1 ? "" : "s"} saved successfully.`, "success");
        updateStatusCounts();
      }

      async function loadData() {
        setStatus("Loading weld log…");
        await Promise.all([preloadHeatOptions(), preloadNdeRigs()]);
        try {
          const response = await fetch(dataEndpoint, { credentials: "same-origin" });
          if (!response.ok) {
            throw new Error(`Failed to load weld log (${response.status})`);
          }
          const payload = await response.json();
          const rows = (payload.rows || []).map(normalizeRow);
          suppressRowAddedEvents = true;
          await table.setData(rows);
          suppressRowAddedEvents = false;
          dirtyRows.clear();
          table.getRows().forEach(row => {
            row.getElement()?.classList.remove("is-dirty");
            snapshotRow(row);
          });
          updateStatusCounts();
          setStatus(`Loaded ${rows.length} weld entr${rows.length === 1 ? "y" : "ies"}.`, "success");
          refreshHistoryButtons();
        } catch (error) {
          console.error(error);
          setStatus(error.message || "Unable to load weld log.", "danger");
        }
      }

      exportCsvBtn?.addEventListener("click", () => {
        table.download("csv", "weld_log.csv");
      });

      exportExcelBtn?.addEventListener("click", () => {
        try {
          table.download("xlsx", "weld_log.xlsx", { sheetName: "Weld Log" });
        } catch (error) {
          console.error("Excel export failed", error);
          setStatus("Excel export unavailable.", "danger");
        }
      });

      saveBtn?.addEventListener("click", () => {
        saveChanges();
      });

      addRowBtn?.addEventListener("click", () => {
        addNewRow();
      });

      deleteEmptiesBtn?.addEventListener("click", () => {
        deleteEmptyRows();
      });

      undoBtn?.addEventListener("click", () => {
        table.undo();
        refreshHistoryButtons();
      });

      redoBtn?.addEventListener("click", () => {
        table.redo();
        refreshHistoryButtons();
      });

      refreshHistoryButtons();
      loadData();
    })();
    </script>
  {% endif %}
{% endblock %}
