{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="h4 mb-3">Upload Document — {{ org.name }}</h1>
<form method="post" enctype="multipart/form-data" class="card card-body">
  {% csrf_token %}
  {{ form|crispy }}
  <div class="mt-2">
    <button class="btn btn-primary">Save</button>
    <a href="{% url 'doc_list' org.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const fileInput = document.getElementById("id_file");
    const nameInput = document.getElementById("id_name");
    const titleInput = document.getElementById("id_title");
    let titleTouched = false;

    if (titleInput) {
      titleInput.addEventListener("input", function () {
        titleTouched = titleInput.value.trim().length > 0;
      });
    }

    function updateFromFile() {
      if (!fileInput || !fileInput.files || !fileInput.files.length) {
        return;
      }
      const selectedName = fileInput.files[0].name;
      if (nameInput && !nameInput.value) {
        nameInput.value = selectedName;
      }
      if (titleInput && !titleTouched) {
        titleInput.value = selectedName;
      }
    }

    if (fileInput) {
      fileInput.addEventListener("change", updateFromFile);
      updateFromFile();
    }
  });
</script>
{% endblock %}
