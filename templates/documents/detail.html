{% extends "base.html" %}
{% block content %}
<h1 class="h5 mb-3">{{ doc.doc_type }} — {{ doc.number }} v{{ doc.version }}</h1>
<p class="text-muted">{{ doc.title }}</p>
<div class="mb-3">
  <a class="btn btn-outline-primary btn-sm" href="{{ doc.file.url }}" target="_blank">Open</a>
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'doc_list' org.slug %}">Back</a>
</div>
<dl class="row">
  <dt class="col-sm-3">SHA-256</dt><dd class="col-sm-9"><code>{{ doc.sha256|default:"(pending)" }}</code></dd>
  <dt class="col-sm-3">Uploaded By</dt><dd class="col-sm-9">{{ doc.uploaded_by }}</dd>
  <dt class="col-sm-3">Created</dt><dd class="col-sm-9">{{ doc.created_at|date:"Y-m-d H:i" }}</dd>
</dl>
{% endblock %}
