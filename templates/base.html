{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 CSS (for .btn, spacing utilities, etc.) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Your page-level additions (icons + drive grid CSS come through here) -->
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">WeldLog</a>
    <div class="d-flex">
      {% if user.is_authenticated %}
        <span class="me-3 text-secondary">{{ user.email }}</span>
        <a class="btn btn-outline-secondary" href="/accounts/logout/">Logout</a>
      {% else %}
        <a class="btn btn-primary" href="/accounts/login/">Login</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    <div class="mb-3">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} mb-2" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
