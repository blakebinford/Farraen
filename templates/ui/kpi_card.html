{#
  Usage:
  {% include 'ui/kpi_card.html' with label='Active Workspaces' value='128' trend='+8.2%' trend_label='vs last week' %}
#}
<div class="kpi-card {{ class|default:'' }}">
  <div class="kpi-card__label">{{ label }}</div>
  <div class="kpi-card__value">{{ value }}</div>
  {% if trend %}
    <div class="kpi-card__trend" style="color: var(--color-success);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="m3 17 6-6 4 4 8-8"/></svg>
      <span>{{ trend }}</span>
      {% if trend_label %}<span class="kpi-card__meta">{{ trend_label }}</span>{% endif %}
    </div>
  {% endif %}
</div>
