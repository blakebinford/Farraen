{% load static %}
<div
    id="quilt-widget"
    class="quilt-widget"
    data-org-id="{{ org.id|default:"" }}"
    data-org-slug="{{ org.slug|default:"" }}"
    data-project-id="{{ project.id|default:"" }}"
    data-project-slug="{{ project.slug|default:"" }}"
>
    <button
        id="quilt-toggle"
        class="quilt-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="quilt-panel"
    >
        <span class="sr-only">Toggle QUILT assistant</span>
        <span aria-hidden="true">💬 QUILT</span>
    </button>
    <div id="quilt-panel" class="quilt-panel" role="dialog" aria-modal="false" aria-labelledby="quilt-title" hidden>
        <header class="quilt-header">
            <h2 id="quilt-title">QUILT Assistant</h2>
            <p class="quilt-subtitle">Quality insights for weld repairs</p>
        </header>
        <section class="quilt-quick-actions" aria-label="Quick actions">
            <button type="button" class="quilt-action" data-action="repairs_summary">Summarize repairs</button>
            <button type="button" class="quilt-action" data-action="top_welders">Top welders by repairs</button>
            <button type="button" class="quilt-action" data-action="repair_rate">Repair rate</button>
            <button type="button" class="quilt-action" data-action="export_csv">Export CSV</button>
        </section>
        <div class="quilt-status" role="status" aria-live="polite"></div>
        <form id="quilt-filters" class="quilt-filters" novalidate>
            <label for="quilt-project-select">Project</label>
            <select id="quilt-project-select" name="project" aria-describedby="quilt-project-hint"></select>
            <p id="quilt-project-hint" class="quilt-hint">Select a project to scope queries.</p>
            <label for="quilt-start-date">Start date</label>
            <input id="quilt-start-date" type="date" name="start_date" />
            <label for="quilt-end-date">End date</label>
            <input id="quilt-end-date" type="date" name="end_date" />
            <label for="quilt-welder">Welder</label>
            <input id="quilt-welder" type="text" name="welder" placeholder="Welder ID" />
            <button type="submit" class="quilt-submit">Run query</button>
        </form>
        <section class="quilt-kpi" aria-label="Key performance indicators">
            <div class="quilt-kpi-grid" role="list"></div>
        </section>
        <section class="quilt-welds" aria-label="Weld results">
            <ol class="quilt-weld-list" role="list"></ol>
            <button type="button" class="quilt-show-more" hidden>Show more</button>
            <p class="quilt-truncation" hidden></p>
        </section>
    </div>
    <noscript>
        <p class="quilt-noscript">
            QUILT requires JavaScript. Visit
            {% if org %}
                <a href="/o/{{ org.slug }}/quilt/">the full assistant</a>
            {% else %}
                <a href="/quilt/">the full assistant</a>
            {% endif %}
            to continue.
        </p>
    </noscript>
</div>
<link rel="stylesheet" href="{% static 'css/quilt.css' %}" />
<script src="{% static 'js/quilt.js' %}" defer></script>
